# Nome da aplicacao
spring.application.name=acaidaday

# Configuracao do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/acaidaday_db?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# Configuracao do JPA / Hibernate (cria e atualiza tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativa cache do Thymeleaf durante o desenvolvimento
spring.thymeleaf.cache=false