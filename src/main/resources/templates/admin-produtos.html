<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos e Adicionais - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f2f7; }
        .navbar-acai { background-color: #4a148c; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-acai mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/painel/pedidos">🍇 Admin - Produtos e Adicionais</a>
        <a href="/painel/pedidos" class="btn btn-light btn-sm fw-bold">Voltar ao Painel</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-dark text-white fw-bold">Cadastrar Novo Açaí</div>
                <div class="card-body">
                    <form th:action="@{/admin/produtos/salvar}" method="post" class="row g-2">
                        <div class="col-8">
                            <input type="text" name="nome" class="form-control form-control-sm" placeholder="Nome (ex: Açaí Tradicional)" required>
                        </div>
                        <div class="col-4">
                            <input type="text" name="tamanho" class="form-control form-control-sm" placeholder="Tamanho (500ml)" required>
                        </div>
                        <div class="col-8">
                            <input type="text" name="descricao" class="form-control form-control-sm" placeholder="Descrição breve">
                        </div>
                        <div class="col-4">
                            <input type="number" step="0.01" name="preco" class="form-control form-control-sm" placeholder="Preço (16.00)" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success btn-sm w-100 fw-bold">+ Adicionar Produto</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Produtos Cadastrados</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="p : ${produtos}">
                        <div>
                            <strong th:text="${p.nome + ' (' + p.tamanho + ')'}"></strong> -
                            <span class="text-success fw-bold">R$ <span th:text="${#numbers.formatDecimal(p.preco, 1, 2)}"></span></span>
                            <span th:if="${!p.disponivel}" class="badge bg-danger ms-1">Indisponível</span>
                        </div>
                        <form th:action="@{'/admin/produtos/' + ${p.id} + '/alternar'}" method="post">
                            <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="${p.disponivel ? 'Pausar' : 'Ativar'}"></button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-dark text-white fw-bold">Cadastrar Novo Adicional</div>
                <div class="card-body">
                    <form th:action="@{/admin/adicionais/salvar}" method="post" class="row g-2">
                        <div class="col-8">
                            <input type="text" name="nome" class="form-control form-control-sm" placeholder="Nome (ex: Nutella, Morango)" required>
                        </div>
                        <div class="col-4">
                            <input type="number" step="0.01" name="preco" class="form-control form-control-sm" placeholder="Preço (3.00)" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success btn-sm w-100 fw-bold">+ Adicionar Complemento</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Adicionais Cadastrados</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="a : ${adicionais}">
                        <div>
                            <strong th:text="${a.nome}"></strong> -
                            <span class="text-success fw-bold">R$ <span th:text="${#numbers.formatDecimal(a.preco, 1, 2)}"></span></span>
                            <span th:if="${!a.disponivel}" class="badge bg-danger ms-1">Indisponível</span>
                        </div>
                        <form th:action="@{'/admin/adicionais/' + ${a.id} + '/alternar'}" method="post">
                            <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="${a.disponivel ? 'Pausar' : 'Ativar'}"></button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
