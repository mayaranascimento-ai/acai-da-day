<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fechamento de Caixa - Açaí da Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f2f7; }
        .navbar-acai { background-color: #4a148c; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-acai mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/painel/pedidos">🍇 Painel Açaí da Day</a>
        <a href="/painel/pedidos" class="btn btn-light btn-sm fw-bold">Voltar aos Pedidos</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white fw-bold">Registrar Fechamento do Dia</div>
                <div class="card-body">
                    <div th:if="${param.sucesso}" class="alert alert-success">Fechamento registrado com sucesso!</div>
                    <form th:action="@{/painel/fechamento}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Data</label>
                            <input type="date" name="dataFechamento" th:value="${hoje}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Valor Total Apurado (R$)</label>
                            <input type="number" step="0.01" name="valorFinal" class="form-control" required placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Observações (Opcional)</label>
                            <textarea name="observacao" class="form-control" rows="2" placeholder="Ex: R$ 200 Pix + R$ 150 Dinheiro"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Salvar Fechamento</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Histórico de Fechamentos</div>
                <div class="card-body table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Valor Final</th>
                                <th>Responsável</th>
                                <th>Observação</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fc : ${fechamentos}">
                                <td th:text="${#temporals.format(fc.dataFechamento, 'dd/MM/yyyy')}"></td>
                                <td class="fw-bold text-success">R$ <span th:text="${#numbers.formatDecimal(fc.valorFinal, 1, 2)}"></span></td>
                                <td th:text="${fc.responsavel.nome}"></td>
                                <td th:text="${fc.observacao}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
