<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Açaí da Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4eef8; }
        .bg-acai { background-color: #4a148c; color: white; }
        .btn-acai { background-color: #6a1b9a; color: white; }
        .btn-acai:hover { background-color: #4a148c; color: white; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-header bg-acai text-center py-3">
                    <h4 class="mb-0">🍇 Açaí da Day</h4>
                    <small>Entre na sua conta para continuar</small>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos.</div>
                    <div th:if="${param.logout}" class="alert alert-info">Você saiu do sistema.</div>
                    <div th:if="${param.cadastrado}" class="alert alert-success">Cadastro realizado! Faça seu login.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="username" class="form-control" required placeholder="seu@email.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="password" class="form-control" required placeholder="******">
                        </div>
                        <button type="submit" class="btn btn-acai w-100 fw-bold">Entrar</button>
                    </form>

                    <hr>
                    <div class="text-center">
                        <p class="mb-1">Ainda não tem conta?</p>
                        <a href="/cadastro" class="btn btn-outline-secondary btn-sm">Criar Conta de Cliente</a>
                        <a href="/cardapio" class="btn btn-link btn-sm d-block mt-2">Voltar ao Cardápio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
