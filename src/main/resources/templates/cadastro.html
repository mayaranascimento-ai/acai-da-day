<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - Açaí da Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4eef8; }
        .bg-acai { background-color: #4a148c; color: white; }
        .btn-acai { background-color: #6a1b9a; color: white; }
        .btn-acai:hover { background-color: #4a148c; color: white; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-header bg-acai text-center py-3">
                    <h4 class="mb-0">🍇 Criar Conta - Açaí da Day</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

                    <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" th:field="*{nome}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">WhatsApp / Telefone</label>
                            <input type="text" th:field="*{telefone}" class="form-control" placeholder="(84) 99999-9999" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" th:field="*{senha}" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-acai w-100 fw-bold">Cadastrar</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/login">Já tenho conta (Fazer Login)</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
