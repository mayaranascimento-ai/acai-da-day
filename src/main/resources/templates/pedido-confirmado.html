<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido Confirmado - Açaí da Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f5fa; }
        .navbar-acai { background-color: #4a148c; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-acai mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/cardapio">🍇 Açaí da Day</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 text-center p-4">
                <div class="mb-3">
                    <span class="badge bg-success fs-6 px-3 py-2">Pedido #<span th:text="${pedido.id}">1</span> Registrado!</span>
                </div>
                <h4 class="fw-bold">Obrigado, <span th:text="${pedido.cliente.nome}">Cliente</span>!</h4>
                <p class="text-muted">Seu pedido já entrou no sistema da loja. Clique no botão abaixo para enviar o comprovante/resumo direto no nosso WhatsApp:</p>

                <div class="bg-light rounded p-3 text-start mb-4">
                    <p class="mb-1"><strong>Total:</strong> R$ <span th:text="${#numbers.formatDecimal(pedido.valorTotal, 1, 2)}">0,00</span></p>
                    <p class="mb-1"><strong>Pagamento:</strong> <span th:text="${pedido.formaPagamento}">Pix</span>
                        <span th:if="${pedido.detalhesPagamento != ''}" th:text="${'(' + pedido.detalhesPagamento + ')'}"></span>
                    </p>
                    <p class="mb-0"><strong>Entrega:</strong> <span th:text="${pedido.enderecoEntrega}">Endereço</span></p>
                </div>

                <a th:href="${linkWhatsApp}" target="_blank" class="btn btn-success btn-lg w-100 fw-bold mb-2">
                    📲 Enviar Pedido no WhatsApp
                </a>
                <a href="/cliente/meus-pedidos" class="btn btn-outline-secondary w-100">Acompanhar Meus Pedidos</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
