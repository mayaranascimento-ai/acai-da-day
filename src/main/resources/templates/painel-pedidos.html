<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel de Pedidos - Açaí da Day</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f2f7; }
        .navbar-acai { background-color: #4a148c; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-acai mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/painel/pedidos">🍇 Painel Açaí da Day</a>
        <div class="d-flex gap-2 flex-wrap">
            <a href="/painel/pedidos" class="btn btn-light btn-sm fw-bold">Pedidos</a>
            <a href="/painel/fechamento" class="btn btn-outline-light btn-sm">Fechamento de Caixa</a>
            <a sec:authorize="hasRole('ADMIN')" href="/admin/produtos" class="btn btn-warning btn-sm fw-bold">Produtos</a>
            <a sec:authorize="hasRole('ADMIN')" href="/admin/usuarios" class="btn btn-warning btn-sm fw-bold">Usuários</a>
            <a href="/cardapio" class="btn btn-outline-light btn-sm">Cardápio</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-danger btn-sm" type="submit">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <h4 class="fw-bold mb-3">Pedidos Recebidos</h4>

    <div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-secondary">Nenhum pedido registrado até o momento.</div>

    <div class="row g-3">
        <div class="col-md-6" th:each="ped : ${pedidos}">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Pedido #<span th:text="${ped.id}">1</span></strong> -
                        <span th:text="${ped.cliente.nome}">Cliente</span>
                        <small class="text-muted d-block" th:text="${ped.cliente.telefone + ' | ' + #temporals.format(ped.dataHora, 'dd/MM HH:mm')}"></small>
                    </div>
                    <span class="badge bg-dark" th:text="${ped.status}">PENDENTE</span>
                </div>
                <div class="card-body">
                    <ul class="mb-2">
                        <li th:each="item : ${ped.itens}">
                            <strong th:text="${item.quantidade + 'x ' + item.produto.nome + ' (' + item.produto.tamanho + ')'}"></strong>
                            <div class="small text-muted" th:if="${!#lists.isEmpty(item.adicionais)}">
                                Adicionais: <span th:each="ad, stat : ${item.adicionais}" th:text="${ad.adicional.nome + (!stat.last ? ', ' : '')}"></span>
                            </div>
                        </li>
                    </ul>
                    <p class="small mb-1"><strong>Entrega:</strong> <span th:text="${ped.enderecoEntrega}"></span></p>
                    <p class="small mb-2"><strong>Pagamento:</strong> <span th:text="${ped.formaPagamento}"></span>
                        <span th:if="${ped.detalhesPagamento != ''}" th:text="${'(' + ped.detalhesPagamento + ')'}"></span>
                    </p>
                    <div class="d-flex justify-content-between align-items-center border-top pt-2">
                        <span class="fs-5 fw-bold text-success">R$ <span th:text="${#numbers.formatDecimal(ped.valorTotal, 1, 2)}">0,00</span></span>

                        <form th:action="@{'/painel/pedidos/' + ${ped.id} + '/status'}" method="post" class="d-flex gap-1">
                            <select name="status" class="form-select form-select-sm">
                                <option value="PENDENTE" th:selected="${ped.status == 'PENDENTE'}">Pendente</option>
                                <option value="PREPARANDO" th:selected="${ped.status == 'PREPARANDO'}">Preparando</option>
                                <option value="SAIU_PARA_ENTREGA" th:selected="${ped.status == 'SAIU_PARA_ENTREGA'}">Saiu p/ Entrega</option>
                                <option value="CONCLUIDO" th:selected="${ped.status == 'CONCLUIDO'}">Concluído</option>
                                <option value="CANCELADO" th:selected="${ped.status == 'CANCELADO'}">Cancelado</option>
                            </select>
                            <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
