<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários e Perfis - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f2f7; }
        .navbar-acai { background-color: #4a148c; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-acai mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/painel/pedidos">🍇 Admin - Usuários e Perfis</a>
        <a href="/painel/pedidos" class="btn btn-light btn-sm fw-bold">Voltar ao Painel</a>
    </div>
</nav>

<div class="container pb-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-bold">Controle de Perfis de Acesso</div>
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Perfil Atual</th>
                        <th>Alterar Perfil</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.nome}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.telefone}"></td>
                        <td><span class="badge bg-primary" th:text="${u.perfil}"></span></td>
                        <td>
                            <form th:action="@{'/admin/usuarios/' + ${u.id} + '/perfil'}" method="post" class="d-flex gap-1">
                                <select name="perfil" class="form-select form-select-sm" style="width: 140px;">
                                    <option value="CLIENTE" th:selected="${u.perfil == 'CLIENTE'}">CLIENTE</option>
                                    <option value="ATENDENTE" th:selected="${u.perfil == 'ATENDENTE'}">ATENDENTE</option>
                                    <option value="ADMIN" th:selected="${u.perfil == 'ADMIN'}">ADMIN</option>
                                </select>
                                <button type="submit" class="btn btn-dark btn-sm">Salvar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
